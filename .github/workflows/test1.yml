name: python program
on: push
jobs:
  python-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: install python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check Python version
        run: python --version
      - name: run Python program
        run: python app.py
      
